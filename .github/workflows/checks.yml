name: Skill checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate skill package
        run: python scripts/validate_repo.py
      - name: Test pricing and research record checks
        run: python -m unittest discover -s tests -v
      - name: Run offline example
        run: python scripts/compare_offers.py examples/offers.synthetic.json --format markdown
      - name: Audit synthetic research
        run: python scripts/audit_research.py examples/research.synthetic.json
  installer:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test offline installer
        run: node --test tests/installer.test.mjs
